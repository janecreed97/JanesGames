<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Add a Tip</title>
<script>
  /* ============================================================
     CONFIG — edit these to customize the joke.
     - Swap the image paths for your own pictures (jpg/png/gif all work).
     - Change the percentages / labels however you like.
     - The order total can also be set from the URL: index.html?total=14.75
     ============================================================ */
  const CONFIG = {
    merchant: "Thank you for your order",
    total: 14.75,
    tips: [
      { percent: 20, image: "images/tip-1.jpg" },
      { percent: 26, image: "images/tip-2.jpg" },
      { percent: 32, image: "images/tip-3.jpg" },
    ],
    customImage: "images/custom.svg",
  };
</script>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6f76;
    --tile: #f2f3f5;
    --tile-press: #e3e5e9;
    --line: #dfe1e5;
    --accent: #006aff;
    --accent-press: #0055cc;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
    overflow: hidden;
  }

  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding: max(28px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right))
             max(28px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left));
  }

  header { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 17px; }
  header .back { display: flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 500; }
  header .back svg { width: 22px; height: 22px; }

  .head { text-align: center; margin: 4vh 0 4vh; }
  .head .merchant { font-size: 18px; color: var(--muted); margin-bottom: 10px; }
  .head h1 { font-size: clamp(34px, 5.2vw, 52px); font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .head .total { font-size: clamp(18px, 2.4vw, 22px); color: var(--muted); margin-top: 10px; }

  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 1fr auto;
    gap: 16px;
    max-width: 1100px; width: 100%; margin: 0 auto;
    max-height: 520px;
  }
  button {
    font: inherit; color: inherit; border: 0; cursor: pointer;
    background: var(--tile); border-radius: 14px;
    transition: background .1s, transform .1s;
  }
  button:active { background: var(--tile-press); transform: scale(0.985); }

  .tip {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    min-height: 150px;
  }
  .tip .pct { font-size: clamp(40px, 6vw, 64px); font-weight: 700; letter-spacing: -0.02em; }
  .tip .amt { font-size: clamp(18px, 2.4vw, 24px); color: var(--muted); }

  .row2 { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr; gap: 10px; justify-items: center; }
  .row2 .wide { width: 100%; }
  .wide { height: 76px; font-size: 21px; font-weight: 600; }

  footer {
    text-align: center; color: var(--muted); font-size: 14px; margin-top: 3vh;
    display: flex; justify-content: center; align-items: center; gap: 8px;
  }
  footer svg { width: 16px; height: 16px; }

  /* Portrait / phone: stack the tiles */
  @media (max-aspect-ratio: 4/5) {
    .grid { grid-template-columns: 1fr; grid-template-rows: none; max-height: none; flex: 0; }
    .tip { min-height: 110px; flex-direction: row; justify-content: space-between; padding: 0 28px; }
    .row2 { grid-column: auto; }
  }

  /* Image reveal */
  #reveal {
    position: fixed; inset: 0; background: #2a2a2a;
    display: none; align-items: center; justify-content: center;
    z-index: 10;
  }
  #reveal.show { display: flex; animation: pop .18s ease-out; }
  #reveal img { width: 100%; height: 100%; object-fit: contain; }
  #reveal .hint {
    position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; color: rgba(255,255,255,.45); font-size: 13px;
  }
  @keyframes pop { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }

  /* Fake "processing" spinner before the reveal */
  #processing {
    position: fixed; inset: 0; background: var(--bg); z-index: 9;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    font-size: 22px; font-weight: 600;
  }
  #processing.show { display: flex; }
  .spinner {
    width: 54px; height: 54px; border-radius: 50%;
    border: 5px solid var(--line); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* "Are you sure?" dialog */
  #confirm {
    position: fixed; inset: 0; z-index: 8;
    background: rgba(0,0,0,.4);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  #confirm.show { display: flex; }
  #confirm .card {
    background: var(--bg); border-radius: 20px; width: 100%; max-width: 520px;
    padding: 36px 28px 28px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    animation: rise .2s ease-out;
  }
  #confirm h2 { font-size: clamp(26px, 3.6vw, 34px); margin: 0 0 28px; letter-spacing: -0.01em; line-height: 1.2; }
  #confirm .actions { display: grid; gap: 12px; }
  #confirm .primary { background: var(--accent); color: #fff; }
  #confirm .primary:active { background: var(--accent-press); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="screen">
    <header>
      <span class="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Back
      </span>
      <span id="clock"></span>
    </header>

    <div class="head">
      <div class="merchant" id="merchant"></div>
      <h1>Add a tip</h1>
      <div class="total" id="total"></div>
    </div>

    <div class="grid" id="grid">
      <div class="row2">
        <button class="wide" data-img="custom">Custom Tip Amount</button>
      </div>
    </div>

    <footer>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      Secure checkout
    </footer>
  </div>

  <div id="confirm">
    <div class="card">
      <h2 id="confirmText">Are you sure?</h2>
      <div class="actions">
        <button class="wide" id="confirmYes">Yes</button>
        <button class="wide primary" id="confirmNo"></button>
      </div>
    </div>
  </div>
  <div id="processing"><div class="spinner"></div><div>Processing…</div></div>
  <div id="reveal"><img alt=""><div class="hint">tap anywhere to go back</div></div>

<script>
  const qs = new URLSearchParams(location.search);
  const total = parseFloat(qs.get("total")) || CONFIG.total;
  const money = n => "$" + n.toFixed(2);

  document.getElementById("merchant").textContent = CONFIG.merchant;
  document.getElementById("total").textContent = "Total " + money(total);

  const grid = document.getElementById("grid");
  const row2 = grid.querySelector(".row2");
  CONFIG.tips.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "tip";
    b.dataset.img = "tip" + i;
    b.innerHTML = `<span class="pct">${t.percent}%</span><span class="amt">${money(total * t.percent / 100)}</span>`;
    grid.insertBefore(b, row2);
  });

  const images = { custom: CONFIG.customImage };
  CONFIG.tips.forEach((t, i) => images["tip" + i] = t.image);
  // Preload so the reveal is instant
  Object.values(images).forEach(src => { new Image().src = src; });

  const processing = document.getElementById("processing");
  const reveal = document.getElementById("reveal");
  const img = reveal.querySelector("img");

  function showImage(key) {
    img.src = images[key];
    processing.classList.add("show");
    setTimeout(() => {
      processing.classList.remove("show");
      reveal.classList.add("show");
    }, 900);
  }

  // Custom tip: "Are you sure?" → "Are you really sure?" → ... up to 5 "really"s
  const MAX_REALLYS = 5;
  const confirmBox = document.getElementById("confirm");
  const confirmText = document.getElementById("confirmText");
  const biggest = CONFIG.tips.reduce((a, t, i) => t.percent > CONFIG.tips[a].percent ? i : a, 0);
  document.getElementById("confirmNo").textContent = `No, tip ${CONFIG.tips[biggest].percent}%`;
  let reallys = 0;

  function askAgain() {
    confirmText.textContent = "Are you " + "really ".repeat(reallys) + "sure?";
    // re-trigger the pop-in animation each time
    const card = confirmBox.querySelector(".card");
    card.style.animation = "none"; card.offsetHeight; card.style.animation = "";
    confirmBox.classList.add("show");
  }
  document.getElementById("confirmYes").addEventListener("click", () => {
    if (reallys >= MAX_REALLYS) {
      confirmBox.classList.remove("show");
      showImage("custom");
    } else {
      reallys++;
      askAgain();
    }
  });
  document.getElementById("confirmNo").addEventListener("click", () => {
    confirmBox.classList.remove("show");
    showImage("tip" + biggest);
  });

  grid.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.img === "custom") { reallys = 0; askAgain(); return; }
    showImage(b.dataset.img);
  });
  reveal.addEventListener("click", () => reveal.classList.remove("show"));

  const clock = document.getElementById("clock");
  const tick = () => clock.textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  tick(); setInterval(tick, 10000);
</script>
</body>
</html>
